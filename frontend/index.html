<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />

    <!-- ── First-screen data seed ────────────────────────────────────────
         First thing after the charset, and a classic (non-module) script on
         purpose: it runs during the initial parse, before a byte of the
         module graph is requested, so the first screen's DATA crosses the
         network alongside the code instead of queueing behind it. Backend:
         ShellController / ShellRenderService. Client: src/shell/seed.ts.

         Seeded routes only: the listing (/turniri, and / — App.tsx redirects
         it there) and one tournament (/turniri/<uuid-or-slug>, section tab
         included, since that is a tab within the same page). /turniri/novi is
         the create wizard, not a tournament.

         Best-effort throughout: the promise never rejects, failure resolves
         to null, and main.tsx waits at most ~400 ms before rendering anyway. -->
    <script>
      (function () {
          try {
              /* Web only. A native build (Capacitor) loads from capacitor://
                 or http://localhost and points REST at VITE_API_URL instead
                 (src/platform/index.ts), so a relative /api/seed would just
                 404 against the WebView's own origin. The native bridge
                 injects window.Capacitor before page scripts run, which is
                 what makes this detectable this early; the app's own
                 Capacitor module has not been parsed yet. Parking no promise
                 also means main.tsx waits for nothing on native. */
              if (location.protocol !== "http:" && location.protocol !== "https:") return
              if (window.Capacitor) return

              var p = location.pathname
              var seeded = p === "/" || p === "/turniri"
              if (!seeded && p.indexOf("/turniri/") === 0) {
                  var segment = p.slice("/turniri/".length).split("/")[0]
                  seeded = !!segment && segment !== "novi"
              }
              if (!seeded) return
              window.__belaSeed = fetch("/api/seed?path=" + encodeURIComponent(p), {
                  /* No credentials, no Authorization: the response is the
                     anonymous variant for everyone, which is exactly what
                     makes it publicly cacheable. */
                  credentials: "omit",
                  headers: { Accept: "application/json" },
              })
                  .then(function (r) { return r.ok ? r.json() : null })
                  .catch(function () { return null })
          } catch (e) {
              /* The shell must never fail to boot because of the seed. */
          }
      })()
    </script>

    <!-- /favicon.ico FIRST and as a real file. Google (and every crawler that
         gives up on parsing HTML) probes the root path blind; without this
         file that request falls through to the SPA and returns index.html
         with 200 text/html, which reads as "there is a favicon here and it
         is broken". Multi-size ICO: 16, 32 and 48 px. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/bela-turniri-symbol.svg" />
    <!-- Apple touch icon — 180x180 PNG with white padding so iOS doesn't
         clip the suits when it rounds the corners on the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light is the app default, so the browser chrome also starts light
         before JS runs. Once ColorModeProvider mounts it appends a second,
         dynamic `theme-color` meta (src/color-mode.tsx, `ThemeColorSync`) that
         tracks the saved live mode. Browsers use the last matching tag in
         document order, so that one takes over after mount. White matches
         manifest.webmanifest's background_color. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- ── Colour mode, before the first paint ───────────────────────────
         ColorModeProvider (next-themes, attribute="class", storageKey
         "theme") can only put class="dark" on <html> once React has mounted,
         so everything painted before that — the shell below, the page
         background, the browser chrome — was white for a dark-mode user, who
         then watched it snap. This reads the same key and applies the same
         class during parse. next-themes re-applies it identically on mount:
         a head start, not a second source of truth.

         `enableSystem` is false in color-mode.tsx (light is the default when
         nothing is stored), so `prefers-color-scheme` gets no vote here
         either. #161719 is the `bg.canvas` dark token / THEME_COLOR_DARK. -->
    <script>
      (function () {
          try {
              if (localStorage.getItem("theme") !== "dark") return
              document.documentElement.classList.add("dark")
              document.documentElement.style.colorScheme = "dark"
              var meta = document.querySelector('meta[name="theme-color"]')
              if (meta) meta.setAttribute("content", "#161719")
          } catch (e) {
              /* private mode / site data blocked — stay on the light default */
          }
      })()
    </script>

    <!-- Warm up the connections the app reaches for early: map tiles on
         /karta (CARTO Voyager basemap) and the location picker used when
         creating a tournament (OpenStreetMap tile server), plus Firebase
         Auth's token endpoints (login/register). Saves the DNS + TLS
         handshake when the user first hits those features. -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />

    <!-- ── PWA / Add to Home Screen ─────────────────────────────────────
         Installable web app metadata. With the manifest below, Chrome
         (Android/desktop) shows an "Install app" option in the URL bar;
         Safari (iOS) supports "Add to Home Screen" via the share menu.
         The four apple-mobile-web-app-* meta tags are iOS-only, since
         iOS Safari predates and ignores parts of the W3C manifest.

         When launched from the home-screen icon the app runs in
         "standalone" mode (no Safari/Chrome chrome around the page),
         which is what makes it feel like a native app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Bela Turniri" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bela Turniri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Platforma za vođenje i praćenje turnira u beli. Kreiraj turnir, prikupi prijave parova i objavi rezultate, igraj belu online i vodi zapisnik partije u bloku." />

    <!-- Open Graph / link previews. og:image must be a raster format
         (PNG/JPEG) — WhatsApp and Facebook crawlers silently drop SVG
         and the share renders without a thumbnail. bela-turniri-og-card.png
         is a purpose-built 1200x630 PNG (the 1.91:1 ratio Facebook/
         WhatsApp/Slack expect for a link-preview card) generated from the
         same brand mark + gradient used by the per-tournament share cards
         (see ShareImageRenderer) and checked into public/. The square
         bela-turniri-symbol.png stays reserved for contexts that want a
         1:1 logo (favicon fallback, Organization JSON-LD "logo" below,
         PWA icons) — a square og:image gets cropped badly by these
         crawlers, which is the gap this file fixes. og:image:secure_url
         and the explicit dimensions help platforms cache and lay out the
         card correctly.

         Per-page overrides (poster art on tournament detail, avatar on
         profile) are set client-side via useDocumentHead and take
         precedence over these defaults. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bela Turniri" />
    <meta property="og:title" content="Bela Turniri — turniri u beli, online bela i zapisnik" />
    <meta property="og:description" content="Platforma za vođenje i praćenje turnira u beli. Kreiraj turnir, prikupi prijave parova i objavi rezultate, igraj belu online i vodi zapisnik partije u bloku." />
    <!-- og:url is the canonical URL of this page. Facebook's scraper flags
         it as a missing required property when absent. The static value
         here is the root URL — useDocumentHead overrides it per-route
         (tournament/profile pages) for JS-aware crawlers; the
         /api/preview/* SSR fallback emits a route-specific og:url too. -->
    <meta property="og:url" content="https://bela-turniri.com/" />
    <meta property="og:image" content="https://bela-turniri.com/bela-turniri-og-card.png" />
    <meta property="og:image:secure_url" content="https://bela-turniri.com/bela-turniri-og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bela Turniri — turniri u beli, online bela i zapisnik" />
    <meta property="og:locale" content="hr_HR" />
    <!-- fb:app_id is "recommended" by Facebook but not strictly required
         — its absence triggers a warning in the FB sharing debugger but
         doesn't block previews from rendering. To silence the warning,
         create a Facebook App at https://developers.facebook.com/apps
         and replace YOUR_APP_ID below (then uncomment the line). An
         empty Facebook App with just a name + contact email is enough.
         <meta property="fb:app_id" content="YOUR_APP_ID" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bela-turniri.com/bela-turniri-og-card.png" />

    <title>Bela Turniri — turniri u beli, online bela i zapisnik</title>

    <!-- ── schema.org JSON-LD ─────────────────────────────────────────────
         Two records keyed off the site root, picked up by Googlebot on
         every page (the SPA navigates client-side but these stay in the
         document head). Reasons they're worth their weight in bytes:

         • WebSite + potentialAction=SearchAction enables the sitelinks
           search box for branded "bela turniri" queries — a search input
           rendered directly inside the Google result that targets our
           /tournaments?q= endpoint. Google ignores this on small sites
           it doesn't recognise yet, but the markup is the prerequisite
           and costs us nothing.

         • Organization gives Google's knowledge graph a canonical logo,
           name, and homepage URL — used for the favicon/brand chip next
           to results and for Google Business-style entity panels.

         Per-route Event/Person JSON-LD is emitted from the backend SSR
         preview controllers (for non-JS crawlers) and via useDocumentHead
         (for Googlebot rendering the SPA). This block is only the
         site-level scaffolding. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bela Turniri",
      "url": "https://bela-turniri.com/",
      "inLanguage": "hr",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://bela-turniri.com/turniri?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Bela Turniri",
      "url": "https://bela-turniri.com/",
      "logo": "https://bela-turniri.com/bela-turniri-symbol.png",
      "sameAs": []
    }
    </script>

    <script>
      (function () {
        var GA_ID = "G-Y0DXHY7BD7";
        var h = location.hostname;
        if (h !== "bela-turniri.com" && h !== "www.bela-turniri.com") return;
        if (GA_ID.indexOf("XXXX") !== -1) return; /* not configured yet */
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        // GDPR: default every consent signal to denied BEFORE the config
        // call below queues any hit. GA4 respects Consent Mode — with
        // analytics_storage denied it still pings a cookieless "consent
        // ping" for basic modelling, but sets no cookies and attaches no
        // identifiers. CookieConsent (src/components/CookieConsent.tsx)
        // calls gtag('consent','update', {analytics_storage:'granted'})
        // once the visitor accepts; until then (or if they decline) this
        // default stands for the session.
        gtag("consent", "default", {
            analytics_storage: "denied",
            ad_storage: "denied",
            ad_user_data: "denied",
            ad_personalization: "denied",
        });
        gtag("js", new Date());
        gtag("config", GA_ID);
      })();
    </script>

    <!-- Reserve the vertical-scrollbar gutter unconditionally. Without this
         rule a route swap from a short page (Kalendar — fits in viewport,
         no scrollbar) to a tall page (Kreiraj turnir — scrollbar appears)
         shifts every centred element ~17px left, which the user spots as a
         jarring layout jump. `scrollbar-gutter: stable` keeps the gutter
         present always, even when content fits, so the content area's
         width is identical between routes. Falls back gracefully on older
         browsers (no jump, just the original behaviour). -->
    <!-- ── Static boot shell ─────────────────────────────────────────────
         The markup inside #root (bottom of this file) is the app's silhouette
         — header bar with the real logo, the toolbar row, three listing cards
         — drawn by the HTML parser before any JS exists. React clears the
         container on its first commit, so the swap is one paint with no blank
         frame between.

         Colours are hand-copied src/system.ts tokens (this has to be inline,
         parsed before the theme bundle exists): bg.canvas #dae7de/#161719,
         bg.panel rgba(255,255,255,.61)/rgba(24,24,27,.61), border.subtle
         #f4f4f5/#27272a, border.glass rgba(0,0,0,.08)/rgba(255,255,255,.10).
         The dark half keys off `:root.dark`, already applied by the script
         above.

         Geometry mirrors the real thing so nothing jumps on mount: NAVBAR_H
         (48/52, components/navChrome.ts), the app Container (maxW 6xl = 72rem,
         px 1rem, py 24px, App.tsx) and ListingCardSkeleton (150/170px poster
         then 4 bars, components/ListingCard.tsx). The grid breakpoints are
         foldable.css's container queries written as media queries — container
         queries would need the JS layout to exist. -->
    <style>
      html { scrollbar-gutter: stable; }

      /* Only `html`, never `body`: Chakra's own `html, body { background-color:
         bg.canvas }` (globalCss in src/system.ts) takes over the visible
         surface the moment its stylesheet lands, and body's opaque box covers
         the viewport anyway. Painting the root here just means the pre-JS
         frames are already the right colour instead of white. */
      html { background-color: #dae7de; }
      html.dark { background-color: #161719; }

      .boot { --boot-line: rgba(0, 0, 0, 0.08); --boot-sk: rgba(0, 0, 0, 0.07);
              --boot-panel: rgba(255, 255, 255, 0.61); --boot-border: #f4f4f5; }
      :root.dark .boot { --boot-line: rgba(255, 255, 255, 0.10); --boot-sk: rgba(255, 255, 255, 0.08);
              --boot-panel: rgba(24, 24, 27, 0.61); --boot-border: #27272a; }

      .boot-bar { border-bottom: 1px solid var(--boot-line); padding-top: env(safe-area-inset-top, 0px); }
      .boot-bar-row { display: flex; align-items: center; gap: 12px; height: 48px;
                      max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
      .boot-logo { width: 28px; height: 28px; display: block; }
      .boot-page { max-width: 72rem; margin: 0 auto; padding: 24px 1rem 0; }
      .boot-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1rem; }
      .boot-card { border: 1px solid var(--boot-border); border-radius: 0.75rem;
                   overflow: hidden; background: var(--boot-panel); }
      .boot-poster { height: 150px; }
      .boot-body { padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

      .boot-sk { background: var(--boot-sk); border-radius: 6px; animation: boot-pulse 1.6s ease-in-out infinite; }
      .boot-toolbar { height: 40px; margin-bottom: 1rem; }
      .boot-navpill { height: 20px; width: 180px; margin-left: auto; }
      .boot-l1 { height: 16px; width: 75%; }
      .boot-l2 { height: 12px; width: 45%; }
      .boot-l3 { height: 8px;  width: 100%; }
      .boot-l4 { height: 20px; width: 35%; }

      @keyframes boot-pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.55 } }
      @media (prefers-reduced-motion: reduce) { .boot-sk { animation: none } }

      @media (min-width: 48em) {
        .boot-bar-row { height: 52px; }
        .boot-poster { height: 170px; }
      }
      @media (min-width: 42rem) { .boot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      @media (min-width: 68rem) { .boot-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot" aria-hidden="true">
      <div class="boot-bar"><div class="boot-bar-row">
        <img class="boot-logo" src="/bela-turniri-symbol.svg" alt="" width="28" height="28" />
        <span class="boot-sk boot-navpill"></span>
      </div></div>
      <div class="boot-page">
        <div class="boot-sk boot-toolbar"></div>
        <div class="boot-grid">
          <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-body">
            <span class="boot-sk boot-l1"></span><span class="boot-sk boot-l2"></span>
            <span class="boot-sk boot-l3"></span><span class="boot-sk boot-l4"></span>
          </div></div>
          <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-body">
            <span class="boot-sk boot-l1"></span><span class="boot-sk boot-l2"></span>
            <span class="boot-sk boot-l3"></span><span class="boot-sk boot-l4"></span>
          </div></div>
          <div class="boot-card"><div class="boot-sk boot-poster"></div><div class="boot-body">
            <span class="boot-sk boot-l1"></span><span class="boot-sk boot-l2"></span>
            <span class="boot-sk boot-l3"></span><span class="boot-sk boot-l4"></span>
          </div></div>
        </div>
      </div>
    </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
