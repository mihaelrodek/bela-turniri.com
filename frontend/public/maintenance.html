<!doctype html>
<html lang="hr" data-maintenance="true">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#2E6343" />
    <!-- Auto-reload every 20 s: the instant the deploy finishes and the flag is
         cleared, the visitor's browser reloads straight into the live app. -->
    <meta http-equiv="refresh" content="20" />
    <title>Nadogradnja u tijeku - Bela turniri</title>
    <style>
        /* Brand palette, hardcoded on purpose: during maintenance EVERY request
           returns this page, so it can load no stylesheet, font or image of its
           own. Keep the accent in sync with the app's theme-color (#2E6343,
           brand.600) and manifest.webmanifest's background_color. */
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(120% 90% at 50% 0%, #FAF6EE 0%, #F7F2E9 62%);
            color: #2A211A;
            display: grid;
            place-items: center;
            padding: clamp(24px, 6vh, 56px) 24px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            width: 100%;
            max-width: 560px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Real app logo (the fan of four suit cards). It must
           be inlined, not <img src>, because during maintenance every request -
           including one for /bela-turniri-symbol.svg - returns THIS page, so
           an external logo would 404. Kept in sync with
           frontend/public/bela-turniri-symbol-light.svg. */
        .logo {
            width: min(148px, 42vw);
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
        }
        .logo svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 8px 22px rgba(20, 40, 70, 0.18)); }
        .wordmark {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0 0 28px;
            color: #2A211A;
        }
        .wordmark span { color: #2E6343; }
        .copy {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 26px;
            line-height: 1.2;
            margin: 0 0 12px;
            letter-spacing: -0.025em;
            font-weight: 800;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            margin: 0 auto;
            max-width: 360px;
            color: #6E6152;
        }
        p + p { margin-top: 10px; }
        /* Mono eyebrow above the headline. */
        .eyebrow {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            /* Trailing letter-spacing after the last glyph widens the text's
               own box without adding a visible glyph, which skews centered
               text to the left. text-indent nudges it back on-center. */
            text-indent: 0.18em;
            text-transform: uppercase;
            text-align: center;
            color: #2E6343;
            /* `auto` on the sides, not 0 — FIX 2026-09-09. Every <p> here is
               `max-width: 360px; margin: 0 auto`, and this rule's shorthand was
               overriding those auto margins with 0. Inside the 440px column the
               360px block then sat flush LEFT, and its centred text landed ~40px
               left of the real centre. Invisible on a phone, where the column is
               already narrower than 360px — which is exactly how it was reported. */
            margin: 0 auto 10px;
        }
        .dots {
            display: inline-flex;
            gap: 6px;
            margin-top: 28px;
        }
        .dots span {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2E6343;
            animation: pulse 1.2s ease-in-out infinite;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.85); }
            50%      { opacity: 1;   transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) {
            .dots span { animation: none; opacity: 0.75; }
        }
        @media (max-width: 520px) {
            .logo { width: min(120px, 38vw); margin-bottom: 16px; }
            .wordmark { font-size: 22px; }
            .copy { max-width: 360px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">
            <svg role="img" aria-label="Bela turniri" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><clipPath id="c"><rect width="100" height="100" rx="22.5"></rect></clipPath></defs><rect width="100" height="100" rx="22.5" fill="#2E6343"></rect><g clip-path="url(#c)"><g transform="rotate(-36 50 88)"><rect x="34" y="24" width="32" height="48" rx="5" fill="#FFFDF8" stroke="#2E6343" stroke-width="3"></rect><path d="M50 8C32 26 12 40 12 58a20 20 0 0 0 33 15l-3 19h16l-3-19a20 20 0 0 0 33-15C88 40 68 26 50 8Z" fill="#4DA66A" transform="translate(37 27) scale(0.12)"></path></g><g transform="rotate(-12 50 88)"><rect x="34" y="24" width="32" height="48" rx="5" fill="#FFFDF8" stroke="#2E6343" stroke-width="3"></rect><path d="M46 8h8v8h-8zM22 42c0-16 12-26 28-26s28 10 28 26v6H22zM27 54h46c0 20-11 34-23 38C38 88 27 74 27 54Z" fill="#B8823F" transform="translate(37 27) scale(0.12)"></path></g><g transform="rotate(12 50 88)"><rect x="34" y="24" width="32" height="48" rx="5" fill="#FFFDF8" stroke="#2E6343" stroke-width="3"></rect><path d="M42 20a8 8 0 0 1 16 0v3c13 6 20 20 20 39v6h8v8H14v-8h8v-6c0-19 7-33 20-39zM42 86a8 8 0 1 0 16 0a8 8 0 1 0-16 0z" fill="#F2C14E" transform="translate(37 27) scale(0.12)"></path></g><g transform="rotate(36 50 88)"><rect x="34" y="24" width="32" height="48" rx="5" fill="#FFFDF8" stroke="#2E6343" stroke-width="3"></rect><path d="M50 88C22 66 10 52 10 33a20 20 0 0 1 40-8a20 20 0 0 1 40 8c0 19-12 33-40 55Z" fill="#E24B4A" transform="translate(37 27) scale(0.12)"></path><path d="M50 88C22 66 10 52 10 33a20 20 0 0 1 40-8a20 20 0 0 1 40 8c0 19-12 33-40 55Z" fill="#E24B4A" transform="translate(41 40) scale(0.18)"></path></g></g></svg>
        </div>
        <p class="wordmark">bela<span>·</span>turniri</p>
        <div class="copy">
            <p class="eyebrow">Nadogradnja</p>
            <h1>Nadogradnja u tijeku</h1>
            <p>
                Radimo na poboljšanjima aplikacije. Stranica će uskoro ponovno biti
                dostupna - stranica se osvježava sama, ne treba ništa raditi.
            </p>
            <p>
                Hvala na strpljenju!
            </p>
            <div class="dots" aria-hidden="true">
                <span></span><span></span><span></span>
            </div>
        </div>
    </main>
</body>
</html>
