        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: radial-gradient(120% 90% at 50% 0%, #1F5039 0%, #173D2C 58%, #12301F 100%);
            color: #F4EFE4;
            display: grid;
            place-items: center;
            padding: clamp(24px, 6vh, 56px) 24px;
            -webkit-font-smoothing: antialiased;
        }
        .card { width: 100%; max-width: 560px; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .logo { width: min(132px, 38vw); margin: 0 auto 22px; display: flex; justify-content: center; }
        .logo svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.32)); }
        .wordmark { width: min(230px, 62vw); margin: 0 0 34px; }
        .wordmark svg { display: block; width: 100%; height: auto; }
        .copy { width: 100%; max-width: 440px; margin: 0 auto; text-align: center; }
        h1 {
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            font-size: 28px;
            line-height: 1.15;
            margin: 0 0 12px;
            letter-spacing: -0.025em;
            font-weight: 600;
        }
        p { font-size: 15px; line-height: 1.6; margin: 0 auto; max-width: 360px; color: rgba(244, 239, 228, 0.74); }
        p + p { margin-top: 10px; }
        .eyebrow {
            font-family: "JetBrains Mono", ui-monospace, monospace;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.1em;
            /* Trailing letter-spacing skews centred text left; nudge it back. */
            text-indent: 0.1em;
            text-transform: uppercase;
            color: #F2C14E;
            margin: 0 auto 10px;
        }
        /* The four suits, pulsing in the logo's order and colours. */
        .dots { display: inline-flex; gap: 7px; margin-top: 28px; }
        .dots span { width: 9px; height: 9px; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
        .dots span:nth-child(1) { background: #E24B4A; }
        .dots span:nth-child(2) { background: #F2C14E; animation-delay: 0.18s; }
        .dots span:nth-child(3) { background: #4DA66A; animation-delay: 0.36s; }
        .dots span:nth-child(4) { background: #B8823F; animation-delay: 0.54s; }
        @keyframes pulse {
            0%, 100% { opacity: 0.35; transform: scale(0.85); }
            50%      { opacity: 1;    transform: scale(1); }
        }
        @media (prefers-reduced-motion: reduce) { .dots span { animation: none; opacity: 0.8; } }
        @media (max-width: 520px) {
            .logo { width: min(108px, 34vw); margin-bottom: 18px; }
            h1 { font-size: 25px; }
        }
    </style>
</head>
