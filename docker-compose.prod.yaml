# Production stack for bela-turniri.com.
#
# Topology:
#   ┌─────────────────────────────────────────────────────────────┐
#   │   Internet → 80/443 → edge (Caddy + SPA static files)       │
#   │                          │                                  │
#   │                  /api/*  ▼                                  │
#   │                       backend (Quarkus, port 8085)          │
#   │                          │                                  │
#   │              ┌───────────┼────────────┐                     │
#   │              ▼           ▼            ▼                     │
#   │          postgres      minio    (Firebase OIDC, external)   │
#   │                                                             │
#   │   bela_internal network (postgres + minio not host-exposed) │
#   └─────────────────────────────────────────────────────────────┘
#
# Run from the repo root, with .env.prod in the same directory:
#
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build
#
# Update workflow - prefer the maintenance-guarded scripts so users see the
# "Nadogradnja u tijeku" page during the rebuild instead of errors:
#
#   ./ops/deploy.sh             # full release: git pull + rebuild + prune
#   ./ops/up.sh                 # guarded compose up (no pull/prune); pass a
#                               # service name to rebuild just that one
#
# The raw command below does the same rebuild but shows NO maintenance page
# (docker compose has no hooks to toggle the flag) - use it only when you
# deliberately want a hot, in-place update with no maintenance page:
#
#   docker compose -f docker-compose.prod.yaml --env-file .env.prod up -d --build
#   docker image prune -f       # reclaim space from old images

# Shared log policy - cap container logs so the json-file driver can't grow
# unbounded and fill the VPS disk. 10 MB × 3 files = max 30 MB per service.
# Merged into each service below via the `<<: *default-logging` anchor.
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bela-postgres
    <<: *default-logging
    restart: unless-stopped
    # Sized for a small VPS (Hetzner CX22, 4 GB RAM) with backend/minio/
    # caddy sharing the box. postgres:16-alpine's own defaults (shared_buffers
    # etc.) are modest enough to run comfortably inside this.
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bela_internal
    # Bound to 127.0.0.1 ONLY — reachable from inside the VPS (e.g. via an
    # SSH tunnel for DBeaver) but never from the public internet. Port 5432
    # is also blocked by UFW, but binding to localhost is the real defense.
    ports:
      - "127.0.0.1:5432:5432"

  minio:
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    container_name: bela-minio
    <<: *default-logging
    restart: unless-stopped
    # Sized for a small VPS - MinIO's own footprint is small at this scale
    # (a handful of posters/avatars, no heavy erasure-coding cluster).
    mem_limit: 256m
    cpus: 0.5
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - bela_internal
    # No `ports:` — bucket is private; the SPA reaches images through
    # the backend's /api/resources/{id}/image proxy.

  minio-setup:
    image: minio/mc:latest
    container_name: bela-minio-setup
    <<: *default-logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until mc alias set minio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          echo "Waiting for MinIO..."; sleep 2
        done
        mc mb -p minio/$$MINIO_BUCKET || true
        echo "MinIO bucket $$MINIO_BUCKET ready (private; backend-only access)."
    restart: "no"
    networks:
      - bela_internal

  backend:
    build:
      context: ./backend
      dockerfile: src/main/docker/Dockerfile.jvm
    image: bela-backend:latest
    container_name: bela-backend
    <<: *default-logging
    restart: unless-stopped
    # Sized for a small VPS (Hetzner CX22, 4 GB RAM) shared with postgres/
    # minio/caddy. JAVA_OPTS below overrides the Dockerfile's default
    # -XX:MaxRAMPercentage=75.0 with a lower percentage: the JVM reads the
    # container's cgroup limit (mem_limit), so 65% of 768m ≈ 500m heap,
    # leaving ~270m for metaspace/thread stacks/direct buffers/GC overhead -
    # tighter than the 75% default leaves at this container size.
    mem_limit: 768m
    cpus: 1.5
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # quarkus.http.root-path=/api, so the SmallRye readiness probe lives at
      # /api/q/health/ready (datasource + MinIO readiness). curl ships in the
      # eclipse-temurin:21-jre base image used by
      # backend/src/main/docker/Dockerfile.jvm (verified: Ubuntu-based, has
      # both curl and wget), so no extra package install needed. Public
      # internet access to /api/q/* is blocked at the Caddy edge (see
      # Caddyfile) - this check hits the container directly.
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/api/q/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      # Activate the prod profile so %prod overrides in application.properties
      # take effect (Swagger off, JSON logs on if configured, etc.).
      QUARKUS_PROFILE: prod

      # Overrides the Dockerfile's default MaxRAMPercentage=75.0 - see the
      # mem_limit comment above for why 65% fits this container size better.
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=65.0 -Djava.security.egd=file:/dev/urandom"

      # Datasource — Postgres is reachable as `postgres` on the internal net.
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # MinIO — internal endpoint name. The backend never touches the
      # public URL; the /api/resources/{id}/image proxy streams bytes.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

      # Firebase OIDC — only needs the project id; no client secret.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}

      # Public-facing config used by the sitemap / preview / startup checks.
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}

      # Web Push (VAPID). If unset the backend boots but /push/public-key
      # returns ready=false and the frontend hook silently no-ops.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:mihael.rodek1@gmail.com}

      # Outgoing e-mail (Resend). If RESEND_API_KEY is unset the backend
      # boots and the contact form still stores every message - it just
      # sends no notification (EmailService WARNs about it at boot).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Bela turniri <noreply@bela-turniri.com>}
      CONTACT_TO: ${CONTACT_TO:-}
    networks:
      - bela_internal

  edge:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Vite inlines these at build time (Firebase web config is non-secret).
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    image: bela-edge:latest
    container_name: bela-edge
    <<: *default-logging
    restart: unless-stopped
    # Sized for a small VPS - Caddy's own footprint is tiny (reverse proxy +
    # static file serving); the rate-limit module and TLS session cache are
    # the only meaningful extra memory users.
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      # service_started, not service_healthy - the backend's own healthcheck
      # can take a while (Liquibase migrations, JVM warmup), and edge doesn't
      # actually need the backend UP to start; Caddy's lb_try_duration on the
      # /api/* reverse_proxy already retries for a few seconds on its own.
      # Gating on service_healthy here would delay `up -d` for the whole
      # stack and risk a deploy deadlock if the backend healthcheck ever
      # flaps during startup.
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy persists Let's Encrypt account + certs here. Without this
      # volume, every container restart would re-fetch certs and you'd
      # hit the Let's Encrypt rate limit.
      - caddy_data:/data
      - caddy_config:/config
      # Maintenance flag (read-only). The deploy script touches/removes
      # ./ops/maintenance/ENABLED on the host; Caddy serves the
      # "Nadogradnja u tijeku" 503 page while that file exists.
      - ./ops/maintenance:/maintenance:ro
    networks:
      - bela_internal

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  bela_internal:
    driver: bridge
