name: Native Builds

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build native app
        run: npm run build:native

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO -derivedDataPath build/DerivedData build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            frontend/android/**/*.gradle*
            frontend/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: npm ci

      - name: Build native app
        run: npm run build:native

      - name: Build Android APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
