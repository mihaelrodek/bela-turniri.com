# --- General ---
quarkus.http.port=8085
quarkus.http.root-path=/api

# --- CORS ---
# Prod: explicit allow-list set via CORS_ORIGINS env var, e.g.
#   CORS_ORIGINS=https://bela-turniri.com,https://www.bela-turniri.com,capacitor://localhost,https://localhost
# Dev: an explicit two-entry allow-list (see below). If you need `vite --host`
# from a phone, add that origin to the %dev list rather than reintroducing a
# wildcard.
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5185}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,Accept,Origin,X-Requested-With,X-Locale,X-Client-Op-Id,X-Waiter-Token,X-Blok-Link-Token

# Dev used to allow any origin via the `/.*/ ` regex. Explicit list instead:
# a wildcard regex means a malicious page on any localhost port (a stray dev
# server, an npm tool's web UI) can read the dev API's responses. 127.0.0.1 and
# localhost are separate origins to the browser, so both are listed.
# The last two are the Capacitor shells: the iOS WebView serves the bundled app
# from the custom `capacitor://localhost` scheme, Android from `https://localhost`.
# Neither is a real host, so listing them cannot expose the API to the network.
%dev.quarkus.http.cors.origins=http://localhost:5185,http://127.0.0.1:5185,capacitor://localhost,https://localhost

# --- File upload limits (Quarkus) ---
quarkus.http.body.handle-file-uploads=true
# Where RESTEasy Reactive stores temp uploads. Absolute path inside /tmp so
# the non-root container user can always write here, regardless of WORKDIR
# ownership. Files are deleted after each request anyway (see below).
quarkus.http.body.uploads-directory=/tmp/quarkus-uploads
# Auto-delete after request ends (you read the file during request)
quarkus.http.body.delete-uploaded-files-on-end=true
# Max total body size (adjust as needed)
quarkus.http.limits.max-body-size=15M

# Cap concurrent connections in prod. Without a ceiling a burst (a crawler,
# a shared tournament link hitting a WhatsApp group) can open more sockets
# than the JDBC pool + worker pool can ever service, and the box dies on file
# descriptors instead of shedding load. 5000 is far above real traffic and far
# below the container's fd limit.
%prod.quarkus.http.limits.max-connections=5000

# --- Realtime websocket (/api/live/{tournamentUuid}) ---
# Server-initiated ping every 30s. Two jobs:
#  1. it keeps the connection alive through proxies and mobile NATs that
#     silently drop an idle TCP session (Caddy, and every carrier), which is
#     what otherwise makes the socket "work in dev, die after a minute in
#     prod" — and a silently dead socket is worse than none, because the
#     client thinks it is connected and stretches its poll to 120s;
#  2. it surfaces half-open connections: a peer that has vanished fails the
#     ping and the connection is closed, freeing the slot instead of parking
#     it forever.
quarkus.websockets-next.server.auto-ping-interval=30S

# Concurrency ceilings for the live channel. These are OURS, not Quarkus':
# websockets-next 3.15 has no max-concurrent-connections property (its
# WebSocketsServerRuntimeConfig exposes only subprotocols, compression, max
# message size, auto-ping-interval, unhandled-failure-strategy, security and
# dev-mode/traffic logging) — setting one would be silently ignored. They are
# enforced in realtime/LiveUpgradeCheck, which refuses the HTTP upgrade with
# 503 once a cap is hit. Caddy's `ws` zone only limits handshake RATE, so it
# cannot bound a client that opens sockets slowly and never closes them.
live.max-connections=2000
live.max-connections-per-tournament=200

# The same ceilings for the shared-blok channel (/live/blok/{token}, see
# realtime/BlokShareUpgradeCheck), kept as their own budget rather than shared
# with the tournament socket's: a tournament is watched by a venue, a shared
# scorepad by the four people at one table and whoever they forwarded the link
# to. Over the cap the handshake is refused with 503; an unknown or revoked
# token is refused with 404 before the query even reaches this budget.
blok-live.max-connections=1000
blok-live.max-connections-per-session=50

# --- MinIO (flattened; read via @ConfigProperty) ---
# Required env vars in prod (no defaults on purpose): MINIO_ROOT_USER, MINIO_ROOT_PASSWORD
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9085}
minio.accessKey=${MINIO_ROOT_USER}
minio.secretKey=${MINIO_ROOT_PASSWORD}
minio.bucket=${MINIO_BUCKET:tournaments}
minio.publicBaseUrl=${MINIO_PUBLIC_BASE_URL:http://localhost:9085}

# --- Dev services ---
# Disabled: we run our own Postgres + MinIO via docker-compose on fixed ports.
# DevServices would otherwise spin up a throwaway Postgres and you'd look at an
# empty DB while your real data sits in the compose container.
quarkus.devservices.enabled=false

# --- Firebase Auth (OIDC) ---
# Firebase issues standard OIDC ID tokens signed with rotating Google keys.
# Set FIREBASE_PROJECT_ID via env var when deploying. No client secret needed —
# the backend only verifies tokens, it never issues them.
quarkus.oidc.auth-server-url=https://securetoken.google.com/${FIREBASE_PROJECT_ID:bela-turniri}
quarkus.oidc.client-id=${FIREBASE_PROJECT_ID:bela-turniri}
quarkus.oidc.token.principal-claim=email
quarkus.oidc.application-type=service
# Tenant must NOT be required for unauthenticated public endpoints
quarkus.oidc.tenant-enabled=true
# Map the Firebase custom-claim "role" into Quarkus SecurityIdentity roles
# (used by @RolesAllowed). A user with no `role` claim simply has no roles.
quarkus.oidc.roles.role-claim-path=role

# --- Auth policies ---
# Lazy auth: OIDC is invoked only when an endpoint declares @Authenticated.
# All endpoints without that annotation stay fully public — anonymous users
# can browse, view, and read everything without ever hitting Firebase.
quarkus.http.auth.proactive=false

# --- Datasource ---
# Required env vars in prod (no defaults on purpose): POSTGRES_USER, POSTGRES_PASSWORD.
# POSTGRES_JDBC_URL lets prod point at any host/port/db without a rebuild;
# the localhost:5485 default matches the dev docker-compose so `quarkus:dev`
# works out of the box.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5485/bela-turniri.com}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}

# Connection-pool sizing. Defaults are conservative; tune up only after you
# know your prod Postgres connection budget. Leak detection logs a warning
# when a connection is held for >10s without being closed (helpful while
# we have no integration tests).
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.acquisition-timeout=10S
quarkus.datasource.jdbc.idle-removal-interval=5M
quarkus.datasource.jdbc.leak-detection-interval=10S

# Batch-load LAZY associations 32 at a time instead of one SELECT per entity.
# The listing and preview endpoints walk collections of tournaments/pairs and
# touch a to-one association on each — classic N+1. This turns N round trips
# into ceil(N/32) without having to add a fetch join to every query.
quarkus.hibernate-orm.fetch.batch-size=32

# --- Dev-only fallbacks ---
# These match docker-compose defaults so `./mvnw quarkus:dev` works without
# needing env vars exported in your shell. Prod still fails fast on missing env.
%dev,test.quarkus.datasource.username=${POSTGRES_USER:mrodek}
%dev,test.quarkus.datasource.password=${POSTGRES_PASSWORD:1234}
%dev,test.minio.accessKey=${MINIO_ROOT_USER:minio}
%dev,test.minio.secretKey=${MINIO_ROOT_PASSWORD:minio12345}
%dev,test.minio.bucket=${MINIO_BUCKET:bela-posters}
%dev,test.game.results.token=${GAME_RESULTS_TOKEN:dev-secret-change-me}

# --- Online game: internal result intake (game/README.md §8.4) ---
# Shared secret between this backend and the Node game server, presented as
# `X-Internal-Token` on POST /api/internal/game-results. The SAME value must be
# set on both services. No default here on purpose: with it unset the endpoint
# refuses every report (401) rather than accepting unauthenticated writes, and
# StartupSanityCheck warns about it at boot in prod. The dev/test fallback is in
# the "Dev-only fallbacks" section above, so `quarkus:dev` needs no env var.
#
# This path must ALSO be blocked at the edge (Caddy 404s it, like /api/q/*) —
# real traffic reaches it over the internal docker network, and the token is a
# second layer of defence rather than the only one.
game.results.token=${GAME_RESULTS_TOKEN:}

# --- Liquibase ---
# Migrations run automatically on every backend startup. The change-log path
# is build-time-fixed: Quarkus scans it during the build to register all
# referenced changesets as runtime resources. If this section disappears
# (file truncation, accidental edit, etc.) Liquibase silently no-ops and
# the database ends up empty — exactly the bug we hit on the first deploy.
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/changelog-master.xml

# --- Web Push (VAPID) ---
# VAPID keypair used to sign Web Push payloads. Frontend fetches the public
# key via /api/push/public-key when subscribing; the private key signs every
# outbound push request. Generate once with the snippet in DEPLOY.md and
# never rotate without a corresponding mass-unsubscribe of existing
# subscriptions (browsers reject pushes signed with a different key).
#
# Subject must be a mailto:/https: URI that identifies who owns the
# pushes — most push services log this in their abuse pipeline.
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:mailto:mihael.rodek1@gmail.com}

# --- Native push (Firebase Cloud Messaging) ---
# Delivery path for the iOS/Android shells, ALONGSIDE Web Push above — a
# browser gets a VAPID push, a native app gets an FCM v1 message, and a user
# who has both gets both. Neither branch can break the other.
#
# Credentials are a Firebase service account for the SAME project as
# FIREBASE_PROJECT_ID (the one whose ID tokens quarkus-oidc verifies):
# Firebase console → Project settings → Service accounts → Generate new
# private key. Supply it either inline as the raw JSON (handy for a secret
# store / docker secret) or as a path to the downloaded file. JSON wins when
# both are set.
#
# Unset = FCM disabled: the backend still boots, still accepts device
# registrations (so tokens accumulate and start working the moment the
# credentials land) and simply sends nothing over FCM. StartupSanityCheck
# warns once at boot in prod.
push.fcm.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
push.fcm.service-account-file=${FIREBASE_SERVICE_ACCOUNT_FILE:}
# Android notification channel the app creates on first run. Must match the
# channel id in the native shell or Android 8+ drops the notification.
push.fcm.android-channel-id=${FCM_ANDROID_CHANNEL_ID:bela}

# --- Open Graph / link previews ---
# Canonical public origin. Every server-rendered preview page builds its
# canonical link, favicon links and og:image from this, so it must have no
# trailing slash and must match the hostname users actually see. Previously
# only StartupSanityCheck looked at APP_PUBLIC_BASE_URL and the controllers
# fell back to their hard-coded default, which meant a dev/staging host
# emitted prod URLs.
app.public-base-url=${APP_PUBLIC_BASE_URL:https://bela-turniri.com}


# --- Caches (Caffeine, via quarkus-cache) ---
# All four memoise output that is identical for every caller: the
# server-rendered SEO/link-preview pages (PreviewRenderService) and the
# sitemap. Crawlers and chat unfurlers hit these in bursts — one shared
# tournament link is fetched once per chat member — and each miss costs
# several queries plus a few KB of string building.
#
# TTLs are the staleness we are willing to show a bot, not a user: previews
# are only ever served to crawlers (Caddy UA-rewrite), so a few minutes of
# stale HTML never reaches a human browsing the SPA. maximum-size bounds
# memory AND bounds the damage of a crawler walking dead links, since the
# 404 pages are memoised too.
quarkus.cache.caffeine."preview-home".expire-after-write=5M
quarkus.cache.caffeine."preview-home".maximum-size=500
quarkus.cache.caffeine."preview-tournament".expire-after-write=5M
quarkus.cache.caffeine."preview-tournament".maximum-size=500
# Profiles change even more rarely than tournaments (stats only move when a
# tournament finishes), so they can hold longer.
quarkus.cache.caffeine."preview-profile".expire-after-write=10M
quarkus.cache.caffeine."preview-profile".maximum-size=500
# The sitemap walks every tournament AND every profile row — the most
# expensive of the four and the one bots refetch most mindlessly.
quarkus.cache.caffeine."sitemap".expire-after-write=15M
quarkus.cache.caffeine."sitemap".maximum-size=500

# The two image caches below are the only ones holding BINARY payloads, and
# quarkus-cache 3.15 can only bound a Caffeine cache by ENTRY COUNT — its
# CacheConfig exposes initial-capacity, maximum-size, expire-after-write,
# expire-after-access and metrics-enabled, and nothing else; there is no
# weigher / maximum-weight (checked, not assumed). So the entry caps have to
# be chosen with the per-entry byte cost in mind, because this box also runs
# Postgres and MinIO and the retained byte[]s are strongly held for the whole
# TTL. Both also get expire-after-access, so a card or code that nobody looks
# at any more releases its bytes long before the write TTL expires — the
# common case, since interest in a tournament link dies within hours.

# Rendered tournament QR codes. Measured PNG sizes: ~9 KB at 256 px, ~30 KB
# at 512, ~75 KB at 1024. The image only changes when the tournament slug
# changes, so a long write TTL is safe; the key is the encoded URL plus the
# size, and size is now quantised to three values
# (QrCodeRenderer.ALLOWED_SIZES), so 60 entries is 20 tournaments fully warm
# in every size, ~4.5 MB worst case. The old cap of 200 was both ~15 MB when
# full AND useless: 769 accepted sizes made the key space attacker-controlled,
# so `?size=257,258,...` missed every time and evicted the real entries.
quarkus.cache.caffeine."qr".expire-after-write=24H
quarkus.cache.caffeine."qr".expire-after-access=2H
quarkus.cache.caffeine."qr".maximum-size=60

# Rendered per-tournament share cards (Open Graph, 1200x630 PNG, measured at
# ~85-90 KB each). Keyed by tournament id + last-updated stamp, so a stale
# card can never outlive an edit. 300 entries retained ~27 MB of strongly-held
# byte[]; 40 (~3.5 MB) still covers every tournament being unfurled in a given
# window — each link is fetched once per chat member, which is the burst the
# cache exists for — on a box that also runs Postgres and MinIO.
quarkus.cache.caffeine."share-image".expire-after-write=6H
quarkus.cache.caffeine."share-image".expire-after-access=1H
quarkus.cache.caffeine."share-image".maximum-size=40

# Public .ics subscription feed. Calendar clients poll this on their own
# schedule (often hourly), so a short TTL is plenty and keeps the two
# full-table reads off the hot path.
quarkus.cache.caffeine."calendar-feed".expire-after-write=15M
quarkus.cache.caffeine."calendar-feed".maximum-size=20

# --- API docs ---
# Swagger UI is off in prod by default; OpenAPI JSON at /q/openapi is on by
# default and would otherwise leak the full admin/auth-required schema to
# anyone who hits it. We don't need either in production for now — the
# frontend is hand-written, not generated from the schema. Flip these on
# (or override per-host) if/when you want to publish the schema.
%prod.quarkus.smallrye-openapi.enable=false
%prod.quarkus.swagger-ui.always-include=false

# --- Logging ---
# JSON logs in prod so a log aggregator (Loki / Datadog / etc.) can ingest
# them without regex parsing. Plain console in dev for readability.
# %prod.quarkus.log.console.json=true   # enable when shipping to an aggregator (needs quarkus-logging-json)
quarkus.log.level=INFO
quarkus.log.category."hr.mrodek".level=INFO
%dev.quarkus.log.category."hr.mrodek".level=DEBUG

# min-level is a BUILD-TIME floor: a category set to DEBUG above still emits
# nothing if the build compiled DEBUG away. Lowered in dev only — leaving it
# at DEBUG in prod would make every category switchable at runtime but costs
# a permanent throughput hit on the logging fast path.
%dev.quarkus.log.min-level=DEBUG

# [%X{requestId}] is the correlation id stamped by RequestIdFilter. Every line
# logged while handling a request carries it, so a bug report quoting the
# X-Request-Id response header becomes a single grep across the whole run.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [%X{requestId}] %s%e%n

# Access log, prod only (in dev the console format above is enough and a
# second line per request just doubles the noise). Combined format plus:
#   %D               request duration in ms — the cheapest latency signal we have
#   %{i,User-Agent}  tells crawler traffic apart from real users
#   %{o,X-Request-Id} the same correlation id as the app log lines
# Deliberately the OUTGOING header rather than %{X,requestId}: the access log
# is written when the response ends, which is after the JAX-RS response filter
# has cleared the MDC, and after Caddy-supplied ids have been normalised. The
# outgoing header is always present because RequestIdFilter echoes it.
%prod.quarkus.http.access-log.enabled=true
%prod.quarkus.http.access-log.pattern=%h %l %u %t "%r" %s %b %D "%{i,User-Agent}" %{o,X-Request-Id}

# --- Outgoing e-mail (Resend HTTP API, services/EmailService) ---
# Transactional mail goes out through https://api.resend.com/emails — one
# authenticated POST, no SMTP stack in the build. Every send is fire-and-forget
# and deferred to after commit, so a dead provider can never fail a request.
#
# With RESEND_API_KEY unset the service logs one INFO line at boot and every
# send is a silent no-op: `quarkus:dev` and the tests need no mail credentials.
# In prod a missing key (or a missing CONTACT_TO) is logged as a WARN by
# EmailService's startup observer — the contact form still stores every
# message, but nobody is notified about it.
#
# app.mail.from must be an address on a domain verified in Resend (SPF + DKIM),
# otherwise Resend rejects the send. See DEPLOY.md → "Email (Resend)".
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Bela turniri <noreply@bela-turniri.com>}
app.mail.contact-to=${CONTACT_TO:}
