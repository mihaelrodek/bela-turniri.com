# Croatian message bundle — the source of truth for backend i18n.
#
# Encoding: UTF-8, diacritics written literally (č ć ž š đ). Loaded through an
# explicit InputStreamReader(..., UTF_8) in services/MessageService.java, never
# through ResourceBundle.getBundle(), so this file must stay UTF-8.
#
# Key convention: <area>.<thing>, camelCase leaves. Positional arguments use
# MessageFormat placeholders ({0}, {1}).
#
# Every human-readable string the backend sends to a person lives here: error
# envelopes, guard-clause messages that surface as a 400/404/409 body, bean
# validation text (see errors/ConstraintViolationExceptionMapper) and the push
# notification titles/bodies under push.*.
#
# The push.* copy is composed for a RECIPIENT, not for the current caller, so
# its call sites must use MessageService.t(Locale, key, ...) with that user's
# stored UserProfile.locale — see the class javadoc on MessageService.
#
# Anything the SPA switches on by exact string (UNPAID_REQUIRED,
# ALREADY_FINISHED, TOURNAMENT_ALREADY_STARTED, … — emitted via
# errors/ApiCodes) is a machine code, NOT a message, and must never be
# translated or moved in here.

