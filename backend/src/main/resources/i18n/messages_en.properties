# English message bundle. Mirrors messages_hr.properties key for key; a key
# missing here falls back to the Croatian value at runtime (MessageService).
#
# Encoding: UTF-8.
#
# Register: informal second person ("you"), matching the Croatian copy.
#
# The push.* copy is composed for a RECIPIENT: its call sites resolve that
# user's stored UserProfile.locale and use MessageService.t(Locale, key, ...).
#
# Machine codes the SPA switches on (UNPAID_REQUIRED, ALREADY_FINISHED, …) are
# NOT messages and never appear in this file.

